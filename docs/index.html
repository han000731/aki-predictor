<section class="panel"><h2>首日 15 项模型输入</h2><dl class="inputs" id="inputs"></dl>

const cases=JSON.parse(document.getElementById('fixtures').textContent);
const picker=document.getElementById('case');
cases.forEach((c,i)=>picker.add(new Option(c.name,i)));
function render(){
 const c=cases[Number(picker.value)];
 document.getElementById('risk').textContent=(100*c.risk).toFixed(2)+'%';
 document.getElementById('missing').textContent='中位数填补 '+c.missing+' / 15 项';
 document.getElementById('inputs').replaceChildren(...c.values.map(v=>{
   const card=document.createElement('div'); card.className=v.missing?'item missing':'item';
   const label=document.createElement('dt');label.textContent=v.label;
   const value=document.createElement('dd');
   const amount=typeof v.value==='number'?Number(v.value.toPrecision(5)).toString():v.value;
   value.textContent=v.missing?'缺测':amount+(v.unit?' '+v.unit:'');
   if(v.missing){const flag=document.createElement('small');flag.textContent='评分时按冻结规则填补';value.append(flag)}
   card.append(label,value);return card;
 }));
}
picker.addEventListener('change',render); render();
